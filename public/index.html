<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Teacher // Terminal</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <button class="new-chat" id="newChat" title="Start a new chat">
                <span>＋</span>
                New chat
            </button>

            <div class="history" id="history"></div>

        </div>

        <div class="sidebar-bottom">

            <div class="terminal-status"><span class="status-dot"></span> SYSTEM ONLINE</div>

            <div class="account">
                <div class="avatar">AI</div>
                <div>
                    <strong>OpenRouter</strong>
                    <small>AI Chat</small>
                </div>
            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <button class="menu" id="menu">
                ☰
            </button>

            <div class="model-wrapper">

                <select id="model">

                    <option value="openrouter/free">
                        OpenRouter Free
                    </option>

                    <option value="openai/gpt-4o">
                        GPT-4o
                    </option>

                    <option value="anthropic/claude-sonnet-4">
                        Claude Sonnet
                    </option>

                    <option value="google/gemini-2.5-flash">
                        Gemini 2.5 Flash
                    </option>

                    <option value="deepseek/deepseek-chat-v3-0324">
                        DeepSeek V3
                    </option>

                </select>

            </div>

        </header>


        <!-- CHAT -->

        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <div class="logo">✦</div>

                <div class="terminal-prompt">$ ai-teacher --ready</div>
                <h1>How can I help?</h1>

                <p>
                    Ask anything and choose an OpenRouter model above.
                </p>
            </div>

        </section>


        <!-- INPUT -->

        <div class="composer-area">

            <form class="composer" id="composer">

                <textarea
                    id="input"
                    placeholder="Message AI..."
                    rows="1"
                    autocomplete="off"
                ></textarea>

                <button
                    type="submit"
                    class="send"
                    id="send"
                >
                    ↑
                </button>

            </form>

            <div class="terminal-hint">ENTER to send&nbsp;&nbsp; • &nbsp;&nbsp;SHIFT+ENTER for newline</div>
            <div class="disclaimer">
                AI can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
