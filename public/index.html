<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Teacher // Terminal</title>

    <link rel="stylesheet" href="styles.css">

    <script src="marked.min.js"></script>
    <script src="purify.min.js"></script>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <button class="new-chat" id="newChat" title="Start a new chat">
                <span>＋</span>
                New chat
            </button>

            <div class="history" id="history"></div>

        </div>

        <div class="sidebar-bottom">

            <div class="terminal-status"><span class="status-dot"></span> SYSTEM ONLINE</div>

            <div class="account">
                <div class="avatar">AI</div>
                <div>
                    <strong>OpenRouter</strong>
                    <small>AI Chat</small>
                </div>
            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <button class="menu" id="menu">
                ☰
            </button>

            <div class="model-wrapper">

                <select id="model">

                    <option value="openrouter/free">
                        OpenRouter Auto (Free)
                    </option>

                    <option value="google/gemini-2.5-flash:free">
                        Gemini 2.5 Flash (Free)
                    </option>

                    <option value="meta-llama/llama-3.2-11b-vision-instruct:free">
                        Llama 3.2 Vision (Free)
                    </option>

                    <option value="qwen/qwen-2-vl-72b-instruct:free">
                        Qwen 2 VL (Free)
                    </option>

                </select>

            </div>

        </header>


        <!-- CHAT -->

        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <div class="logo">✦</div>

                <div class="terminal-prompt">$ ai-teacher --ready</div>
                <h1>How can I help?</h1>

                <p>
                    Ask anything, attach images for MCQs, and choose an OpenRouter model above.
                </p>
            </div>

        </section>


        <!-- INPUT -->

        <div class="composer-area">

            <form class="composer" id="composer" style="flex-wrap: wrap;">

                <div id="imagePreviewContainer" style="display: none; width: 100%; padding: 5px 10px 10px;">
                    <div style="position: relative; display: inline-block;">
                        <img id="imagePreview" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Preview" style="max-height: 100px; border-radius: 8px; border: 1px solid var(--border);">
                        <button type="button" id="removeImageBtn" style="position: absolute; top: -5px; right: -5px; background: var(--red); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px; line-height: 1;">×</button>
                    </div>
                </div>

                <button type="button" id="attachBtn" title="Attach Image" style="background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 10px; padding-left: 5px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">

                <textarea
                    id="input"
                    placeholder="Message AI..."
                    rows="1"
                    autocomplete="off"
                ></textarea>

                <button
                    type="submit"
                    class="send"
                    id="send"
                >
                    ↑
                </button>

            </form>

            <div class="terminal-hint">ENTER to send&nbsp;&nbsp; • &nbsp;&nbsp;SHIFT+ENTER for newline</div>
            <div class="disclaimer">
                AI can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
