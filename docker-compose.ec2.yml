services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.aws}
      POSTGRES_DB: ragdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 100

  rag:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.aws
    environment:
      PORT: 8000
      WORKERS: 1
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/ragdb
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - rag_data:/app/data
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 150

  chat:
    build:
      context: .
      dockerfile: dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "80:3000"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100

volumes:
  postgres_data:
  rag_data:
