<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analysis</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #fff;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: #1e1e1e;
                color: #f0f0f0;
            }
        }
        .header {
            padding: 12px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        @media (prefers-color-scheme: dark) {
            .header {
                background: #2a2a2a;
                border-bottom-color: #333;
            }
        }
        .content {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .loading {
            color: #6e8efb;
            font-style: italic;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .error {
            color: #ff4757;
        }
        .selected-text {
            padding: 10px 15px;
            background: #f0f4f8;
            border-left: 4px solid #6e8efb;
            margin-bottom: 20px;
            font-style: italic;
            font-size: 13px;
        }
        @media (prefers-color-scheme: dark) {
            .selected-text {
                background: #2d3748;
                border-left-color: #8b9ff7;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        ✨ AI Analysis
    </div>
    <div class="content" id="content">
        <div id="quote" class="selected-text"></div>
        <div id="response" class="loading">Connecting to AI...</div>
    </div>
    <script src="analysis-window.js"></script>
</body>
</html>
