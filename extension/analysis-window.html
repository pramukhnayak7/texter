<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Teacher - Lens Window</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --subtext: #666;
            --border: #e2e8f0;
            --card-bg: #f8fafc;
            --primary: #4f46e5;
            --accent: #10b981;
            --error: #ef4444;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #141416;
                --text: #f3f4f6;
                --subtext: #9ca3af;
                --border: #27272a;
                --card-bg: #1e1e24;
                --primary: #6366f1;
                --accent: #34d399;
                --error: #f87171;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .header {
            padding: 10px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: opacity 0.15s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .content {
            padding: 16px;
            flex-grow: 1;
            overflow-y: auto;
            line-height: 1.6;
            font-size: 14px;
        }

        .preview-box {
            display: none;
            margin-bottom: 12px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            max-height: 160px;
        }

        .preview-box img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }

        .selected-text {
            display: none;
            padding: 10px 14px;
            background: var(--card-bg);
            border-left: 4px solid var(--primary);
            margin-bottom: 14px;
            font-style: italic;
            font-size: 13px;
            border-radius: 0 6px 6px 0;
        }

        .response-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            min-height: 120px;
            white-space: pre-wrap;
            user-select: text;
        }

        .loading {
            color: var(--primary);
            font-style: italic;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .error {
            color: var(--error);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <span>✨ AI Teacher Lens</span>
        </div>
        <div class="header-actions">
            <button class="btn-action" id="snapBtn">📸 Snap Screen</button>
            <button class="btn-action btn-secondary" id="copyBtn">📋 Copy</button>
        </div>
    </div>
    <div class="content">
        <div id="previewBox" class="preview-box">
            <img id="previewImg" alt="Screen preview">
        </div>
        <div id="quote" class="selected-text"></div>
        <div id="response" class="response-box loading">Initializing...</div>
    </div>
    <script src="analysis-window.js"></script>
</body>
</html>
