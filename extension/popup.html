<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Teacher Copilot</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 240px;
            padding: 14px;
            margin: 0;
            background: #ffffff;
            color: #0f172a;
            text-align: center;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: #111114;
                color: #f3f4f6;
            }
        }
        .btn {
            width: 100%;
            padding: 10px 12px;
            background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
        .desc {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <button class="btn" id="openPanelBtn">
        <span>✨ Open Copilot Sidebar</span>
    </button>
    <div class="desc">Opens the AI Copilot on the right side of your screen.</div>
    <script src="popup.js"></script>
</body>
</html>
